<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --bg: #fafaf7;
        --ink: #14140f;
        --muted: #5a5750;
        --line: #e4e1d8;
        --accent: #a8471e;
        --surface: #f3f2eb;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); }
      body {
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        padding: 0 20px 90px;
      }
      .page { max-width: 660px; margin: 0 auto; }
      a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(168,71,30,.35); }
      a:hover { color: #7c3013; border-bottom-color: #7c3013; }
      button { font-family: inherit; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      input:focus { outline: none; }
      ::selection { background: #f0dfd4; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      [hidden] { display: none !important; }

      .brand { display: flex; align-items: center; gap: 9px; padding: 26px 0 0; font-size: 13.5px; font-weight: 500; }
      .logo { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
      .logo i { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

      .hero h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 400;
        font-size: clamp(30px, 6.4vw, 40px);
        line-height: 1.15;
        letter-spacing: -.015em;
        margin: 40px 0 4px;
        text-align: center;
        text-wrap: balance;
      }

      .search { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 22px 0 0; }
      .search-row { display: flex; gap: 10px; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 9px; }
      .search input {
        flex: 1; min-width: 0; border: none; background: transparent;
        font-family: inherit; font-size: 17px; color: var(--ink); padding: 10px 0;
      }
      .search input::placeholder { color: #8b877c; }
      .linkbtn { border: none; background: transparent; color: var(--muted); font-size: 14px; height: 44px; padding: 0 2px; cursor: pointer; }
      .linkbtn:hover { color: var(--ink); }
      #search-btn { border: none; background: transparent; font-size: 15px; font-weight: 500; height: 44px; padding: 0; cursor: pointer; }
      #search-btn:disabled { opacity: 0.45; cursor: not-allowed; }

      .tokens { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0 10px; }
      .tokens .label { font-size: 12.5px; color: var(--muted); }
      .token { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; background: #f1efe7; border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; }
      .token .kind { color: var(--muted); }
      .spacer { height: 14px; }

      .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .pill {
        display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
        border: 1px solid var(--line); border-radius: 999px; background: #f4f3ec;
        font-size: 14.5px; color: var(--ink); cursor: pointer;
      }
      .pill:hover { border-color: var(--accent); color: var(--accent); }
      .pill .intent { color: var(--muted); font-size: 12.5px; }

      .statusrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
      .status { font-size: 14px; color: var(--muted); margin: 0; }
      .status.pulse { animation: dim 1.2s ease-in-out infinite; }
      .underlined { border: none; background: transparent; color: var(--muted); font-size: 14px; height: 44px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      .underlined:hover { color: var(--ink); }

      .answer { font-family: "Source Serif 4", Georgia, serif; font-size: 22px; line-height: 1.55; margin: 22px 0 0; max-width: 48ch; text-wrap: pretty; }
      .answer .place {
        border: none; background: transparent; font-family: inherit; font-size: inherit; line-height: inherit;
        color: var(--accent); padding: 0 1px; cursor: pointer; border-bottom: 2px solid rgba(168,71,30,.4);
      }
      .answer .place:hover { background: #f3ebe5; }

      .notice { margin: 16px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--muted); max-width: 52ch; border-left: 2px solid #d7d2c4; padding-left: 12px; }

      .map-wrap {
        margin-top: 30px; border: 1px solid var(--line); background: #f2f1ea;
        height: 220px; position: relative; overflow: hidden;
      }
      .map { height: 100%; width: 100%; }
      .map .leaflet-container, .map-wrap .leaflet-container { height: 100%; width: 100%; background: #f2f1ea; font-family: inherit; }
      .map-wrap .leaflet-div-icon { background: transparent; border: none; }
      .map-wrap .caption { position: absolute; left: 10px; bottom: 8px; z-index: 500; font-size: 11.5px; color: var(--muted); background: rgba(250,250,247,.9); padding: 3px 6px; pointer-events: none; }
      .pin { display: flex; flex-direction: column; align-items: center; gap: 2px; border: none; background: transparent; padding: 0; cursor: pointer; }
      .pin span.dot {
        display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%;
        background: #3e3a31; color: var(--bg); border: 2px solid var(--bg); box-shadow: 0 1px 3px rgba(20,20,15,.3); font-size: 12.5px; font-weight: 500;
      }
      .pin span.stick { width: 2px; height: 8px; background: #3e3a31; }
      .pin.on span.dot, .pin.on span.stick { background: var(--accent); }

      .resultshead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
      .resultshead button { height: 36px; font-size: 13px; }

      .row { border-bottom: 1px solid var(--line); }
      .row.on { background: var(--surface); }
      .rowhead { width: 100%; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; border: none; background: transparent; text-align: left; padding: 14px 8px; min-height: 56px; cursor: pointer; animation: rise 130ms ease-out both; }
      .rowhead .left { display: flex; gap: 11px; align-items: flex-start; min-width: 0; }
      .num { flex: none; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #3e3a31; color: var(--bg); font-size: 12px; margin-top: 3px; }
      .row.on .num { background: var(--accent); }
      .name { display: block; font-family: "Source Serif 4", Georgia, serif; font-size: 19px; line-height: 1.3; }
      .meta1 { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
      .meta1 .stars { color: #8a6510; }
      .toggle { flex: none; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
      .details { padding: 0 8px 18px 41px; animation: fade 120ms ease-out both; }
      .details p { margin: 0; font-size: 15.5px; line-height: 1.65; color: #2f2c25; max-width: 52ch; text-wrap: pretty; }
      .details .addr { margin-top: 8px; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
      .details .links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 4px; }
      .details .links a, .details .links span { font-size: 14px; display: inline-flex; align-items: center; min-height: 44px; }
      .details .links span { color: var(--muted); }

      .skeleton { border-bottom: 1px solid var(--line); padding: 18px 8px; animation: dim 1.1s ease-in-out infinite; }
      .skeleton .a { height: 16px; background: #edeae0; }
      .skeleton .b { height: 12px; margin-top: 9px; background: #f0eee6; }

      .more { margin-top: 16px; border: none; background: transparent; font-size: 15px; color: var(--ink); padding: 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #c9c4b6; }
      .more:hover { color: var(--accent); }

      .error { margin-top: 24px; border-left: 2px solid var(--accent); padding-left: 14px; }
      .error h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 20px; font-weight: 400; margin: 0 0 6px; }
      .error p { font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 46ch; margin: 0; }
      .error button { margin-top: 8px; border: none; background: transparent; font-size: 15px; font-weight: 500; color: var(--accent); padding: 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

      .foot { margin-top: 54px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.7; color: var(--muted); }

      @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
      @keyframes dim { 0%, 100% { opacity: .5 } 50% { opacity: .18 } }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="brand"><span class="logo"><i></i></span> Top Coffee</div>

      <header class="hero" id="hero">
        <h1>Coffee break? Find your top.</h1>
      </header>

      <form class="search" id="search-form">
        <div class="search-row">
          <label class="sr-only" for="query">Search</label>
          <input id="query" name="query" type="search" placeholder="quiet place to work in Gràcia" autocomplete="off" maxlength="300" required />
          <button type="button" class="linkbtn" id="clear-btn" hidden>Clear</button>
          <button type="submit" id="search-btn">Ask →</button>
        </div>
        <div class="tokens" id="tokens" hidden></div>
        <div class="spacer" id="spacer"></div>
      </form>

      <div class="pills" id="examples"></div>

      <div class="statusrow" id="statusrow" hidden>
        <p class="status pulse" id="status" aria-live="polite"></p>
        <button type="button" class="underlined" id="stop-btn">Stop</button>
      </div>

      <p class="answer" id="answer" hidden></p>
      <p class="notice" id="notice" hidden></p>

      <div class="map-wrap" id="map-wrap" hidden>
        <div class="map" id="map"></div>
        <div class="caption" id="map-caption">Pins follow cafe coordinates</div>
      </div>

      <div class="resultshead" id="results-head" hidden>
        <span id="results-count"></span>
        <button type="button" class="underlined" id="copy-btn">Copy link</button>
      </div>

      <section id="results" class="results" tabindex="-1"></section>
      <button type="button" class="more" id="more-btn" hidden>Show more</button>

      <div class="error" id="error" hidden>
        <h2>The search failed on our side.</h2>
        <p>Your question is still in the field and in the link, so nothing is lost.</p>
        <button type="button" id="retry-btn">Ask again</button>
      </div>

      <div class="foot">
        <div>Coffee only. If the guide has nothing, it says so instead of guessing.</div>
        <div id="keyhint" hidden>Press / to ask, Esc to start over.</div>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/search-app.js"></script>
  </body>
</html>
