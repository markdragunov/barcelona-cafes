name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
    - name: Lint with flake8
      run: |
        LINT_PATHS=()
        for dir in rag scripts tests; do
          if [ -d "$dir" ]; then
            LINT_PATHS+=("$dir")
          fi
        done
        if [ ${#LINT_PATHS[@]} -eq 0 ]; then
          echo "No Python directories to lint"
          exit 0
        fi
        # stop the build if there are Python syntax errors or undefined names
        flake8 "${LINT_PATHS[@]}" --count --select=E9,F63,F7,F821,F822,F823 --show-source --statistics
        # Style/complexity stay advisory so a long line cannot hide a syntax error.
        flake8 "${LINT_PATHS[@]}" --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with unittest
      run: |
        python -m unittest discover -s tests -v

  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Node dependencies
      run: npm ci
    - name: Test with node --test
      run: npm test
